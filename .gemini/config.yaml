project:
  name: "SkyrimNet_SexLab Framework"
  version: "1.0.0"
  type: "Skyrim Modding / Papyrus Framework"

technical_stack:
  language: "Papyrus (Skyrim SE/AE)"
  compiler: "Pyro"
  primary_editor: "VS Code"
  core_dependencies:
    - "SexLabFramework"
    - "JContainers (JMap, JValue)"
    - "PO3_SKSEFunctions"
    - "StorageUtil"
    - "UIExtensions"
    - "SkyUI (SKI_ConfigBase)"

context_rules:
  manifest_tracking: true
  manifest_path_strategy: "manifest/(relative_source_path).md" # e.g., Scripts/Source/cat.psc -> manifest/Scripts/Source/cat.psc.md
  enforce_strict_types: true
  auto_reference_check:
    target: "0x800" # Common base FormID for project quests
  
workflow_priorities:
  1: "Fix high-severity syntax and type-casting errors"
  2: "Resolve JContainers memory leaks (JValue.release)"
  3: "Sanitize Game.GetFormFromFile lookups"
  4: "Refactor string-concatenated JSON to JMap"