<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyrimNet SexLab HUD</title>
    <!--
        Scene HUD (C++ Hud.cpp). Shown without Focus: no cursor, no input, game keeps running.
        C++ pushes hudUpdate({groups, focus, actors (denied: 🔒), keys (+ free: SexLab free camera, display only), blocked, paused,
        slower / faster (speed level a press steps to, "" at either end), stage, stages}) each engine tick when it changes.
        Two independent parts: #enjoyment (stage row + actor rows; groups.enjoyment only) and #controls (everything else).
        Same position and scale as the overlay's ControlPanel (#left-column in index.html).
    -->
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root {
            --text-primary:  #e8e6e1;
            --text-secondary:#a8a5a0;
            --text-muted:    #65635e;
            --accent:        #c9a84c;
            --danger:        #e54545;
            --font-ui:       'Segoe UI', 'Microsoft YaHei UI', 'Meiryo', system-ui, sans-serif;
            --text-sm:       28px;
            --text-base:     30px;
            --space-xs:      4px;
            --space-sm:      8px;
            --space-md:      14px;
            --radius:        6px;
        }
        html {
            font-family: var(--font-ui);
            font-size: var(--text-base);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            user-select: none;
            pointer-events: none;
            color: var(--text-primary);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.8);
        }
        #hud {
            position: absolute;
            top: 10%;
            left: 10%;
            display: none;
            flex-direction: column;
            gap: var(--space-sm);
            /* Fixed width: focus + name + magicka + stamina + bar + lock columns (+ cell padding). */
            width: calc(1.4em + 12em + 60px + 60px + 180px + 1.2em + 6 * var(--space-sm));
        }
        #hud.visible { display: flex; }
        /* Hidden parts keep their space so nothing else moves. */
        .off { visibility: hidden; }

        /* Stage row (first table row, magicka..enjoyment columns): one bar per stage, active = yellow, rest = blue */
        .stages { display: flex; gap: 3px; }
        #enjoyment td.stagelabel { text-align: right; padding-right: 1em; color: var(--text-secondary); white-space: nowrap; }
        .stg {
            flex: 1;
            height: 10px;
            border-radius: var(--radius);
            background-color: #3f7fe0;
            box-shadow: 0 0 0 1px rgba(201, 168, 76, 0.35);
            transition: background-color 0.4s linear;
        }
        .stg.active { background-color: #ffd24f; }

        /* Invisible table: focus | name | magicka | stamina | enjoyment (focus + resources: mini-game only) */
        #enjoyment { border-collapse: collapse; width: 100%; visibility: hidden; }
        #enjoyment.visible { visibility: visible; }
        #enjoyment td { padding: 1px var(--space-sm) 1px 0; vertical-align: middle; }
        td.focus { width: 1.4em; text-align: center; color: var(--text-secondary); font-weight: 600; }
        td.focus.on { color: var(--accent); }
        td.name { white-space: nowrap; width: 12em; max-width: 12em; overflow: hidden; text-overflow: ellipsis; }
        tr.broken td.name { color: var(--text-muted); font-style: italic; }
        td.name .dom { font-size: 0.7em; font-weight: 600; color: var(--accent); vertical-align: middle; }
        td.barcell { width: 180px; }
        td.rescell { width: 60px; }
        .bar.res { height: 6px; }
        .fill.magicka { background-color: #3f7fe0; }
        .fill.stamina { background-color: #4fbf5a; }
        .bar {
            position: relative;
            height: 10px;
            border-radius: var(--radius);
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 1px rgba(201, 168, 76, 0.35);
            overflow: hidden;
        }
        .fill {
            height: 100%;
            width: 0%;
            border-radius: var(--radius);
            transition: width 0.25s linear, background-color 0.4s linear;
        }
        .bar.near .fill { animation: pulse 0.9s ease-in-out infinite; }
        .bar.flash .fill { animation: orgasm 0.45s linear infinite; width: 100% !important; }
        @keyframes pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.6); }
        }
        @keyframes orgasm {
            0%   { background-color: #ff4fa3; }
            25%  { background-color: #ffd24f; }
            50%  { background-color: #ffffff; }
            75%  { background-color: #b44fff; }
            100% { background-color: #ff4fa3; }
        }

        /* Controls: 5 x 2 grid laid out like the numpad. Top row "[key] over label", bottom row "label over [key]". */
        #controls {
            display: grid;
            visibility: hidden;
            grid-template-columns: repeat(5, max-content);
            justify-content: start;
            gap: var(--space-xs) var(--space-md);
            font-size: var(--text-sm);
        }
        #controls.visible { visibility: visible; }
        .ctl { display: flex; flex-direction: column; align-items: center; gap: 2px; white-space: nowrap; }
        .ctl.speed { align-items: flex-start; }
        /* Every label a column can show is stacked invisibly in the cell, so the column is always as wide as its longest label. */
        .label { display: grid; justify-items: center; }
        .ctl.speed .label { justify-items: start; }
        .label > span { grid-area: 1 / 1; }
        .label > .sizer { visibility: hidden; }
        .key {
            display: inline-block;
            min-width: 3.6em;  /* "Num 8" etc. all render the same width */
            padding: 0 5px;
            border: 1px solid rgba(201, 168, 76, 0.6);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.45);
            color: var(--accent);
            font-size: 24px;
            text-align: center;
            line-height: 1.5;
        }
        .ctl.blocked, .ctl.dim { opacity: 0.4; }
        td.lock { width: 1.2em; text-align: center; }
        .ctl.blocked .label .text { text-decoration: line-through; }
    </style>
</head>
<body>
    <div id="hud">
        <table id="enjoyment"><tbody id="rows"></tbody></table>
        <div id="controls"></div>
    </div>

    <script>
        // ── Display scale: same rule as index.html (body.zoom = Dashboard ui_scale × up-only 1080p baseline) ──
        let _uiUserScale = 1;
        function resolutionBaseline() {
            const s = window.innerHeight / 1080;
            return s > 1.05 ? s * 0.85 : 1;
        }
        function applyUiScale(userScale) {
            _uiUserScale = Math.max(0.75, Math.min(1.5, Number(userScale) || 1));
            document.body.style.zoom = String(_uiUserScale * resolutionBaseline());
        }
        function skyrimNetApiBase() {
            if (typeof window.__SN_BASE__ === 'string' && window.__SN_BASE__)
                return window.__SN_BASE__.replace(/\/$/, '');
            return 'http://localhost:8080';
        }
        function loadDashboardUiScale() {
            fetch(skyrimNetApiBase() + '/config?api=get&name=Dashboard')
                .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
                .then(function (body) {
                    const d = (body && body.data) ? body.data : {};
                    applyUiScale(typeof d.ui_scale === 'number' ? d.ui_scale : 1);
                })
                .catch(function () { applyUiScale(_uiUserScale); });
        }
        applyUiScale(1);
        loadDashboardUiScale();
        window.addEventListener('resize', function () { applyUiScale(_uiUserScale); });

        // ── Rendering ──
        const ARROWS = { Up: '↑', Down: '↓', Left: '←', Right: '→' };

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function keyLabel(keys, control) {
            const k = keys && keys[control];
            return k ? (ARROWS[k] || k) : '';
        }

        // Enjoyment 0..100 → gold (calm) to hot pink (close).
        function barColor(e) {
            const t = Math.max(0, Math.min(1, e / 100));
            const from = [201, 168, 76], to = [255, 60, 120];
            const c = from.map(function (v, i) { return Math.round(v + (to[i] - v) * t); });
            return 'rgb(' + c.join(',') + ')';
        }

        // Mini-game resource bar: kind 'magicka' (calm cost) or 'stamina' (arouse cost), pct 0..100.
        function resBar(kind, pct, off) {
            return '<td class="rescell' + (off || '') + '"><div class="bar res"><div class="fill ' + kind + '" style="width:' +
                Math.max(0, Math.min(100, Number(pct) || 0)) + '%"></div></div></td>';
        }

        // Speed level names, slowest first. Mirrors OrgasmEngine::kSpeedLevelNames (SKSE_Source/include/OrgasmEngine.h).
        const SPEED_NAMES = ['slow and gentle', 'gentle', 'normal', 'forceful', 'fast and forceful'];
        const NO_STEP = '—';

        // Every label each grid column can show; each cell carries them as invisible sizers so widths never change.
        const COLUMN_LABELS = [
            ['calm', 'broken', 'previous'],
            ['arouse', 'pause', 'play'],
            ['deny', 'allow', 'next'],
            ['free 📷', 'end'],
            SPEED_NAMES.concat([NO_STEP]),
        ];

        // One grid cell. top: key over label (else label over key). col: 0-based grid column (sizer set).
        // off: render invisibly so the slot keeps its size; blocked: dim + strike; dim: dim only.
        function ctl(keys, control, label, col, top, opts) {
            opts = opts || {};
            const k = keyLabel(keys, control);
            const key = '<span class="key' + (k ? '' : ' off') + '">' + esc(k || '?') + '</span>';
            let lab = '<span class="label">';
            COLUMN_LABELS[col].forEach(function (s) { lab += '<span class="sizer">' + esc(s) + '</span>'; });
            lab += '<span class="text">' + esc(label) + '</span></span>';
            const cls = (col === 4 ? ' speed' : '') + (opts.blocked ? ' blocked' : '') + (opts.dim ? ' dim' : '') +
                (opts.off || !k ? ' off' : '');
            return '<span class="ctl' + cls + '">' + (top ? key + lab : lab + key) + '</span>';
        }

        function hudUpdate(state) {
            const hud = document.getElementById('hud');
            if (!state || !state.groups) { hud.classList.remove('visible'); return; }
            const g = state.groups;
            const actors = state.actors || [];
            const keys = state.keys || {};
            const blocked = state.blocked || {};

            // Enjoyment part: stage row + actor rows (bars; mini-game adds focus + magicka/stamina columns).
            const rows = document.getElementById('rows');
            let html = '';
            // All columns are always emitted; non-minigame columns get .off so widths never change.
            const mgOff = g.minigame ? '' : ' off';
            {
                actors.forEach(function (a, i) {
                    // Number = focus key; the focused actor's number becomes an arrow at its name.
                    const focus = (i === state.focus) ? '▶' : (i < 4 ? String(i + 1) : '');
                    const cls = (a.flash ? ' flash' : '') + (!a.flash && a.near ? ' near' : '');
                    html += '<tr class="' + (a.broken ? 'broken' : '') + '">' +
                        '<td class="focus' + (i === state.focus ? ' on' : '') + mgOff + '">' + focus + '</td>' +
                        '<td class="name">' + esc(a.name) + (a.dom ? ' <span class="dom" title="DOM decides the orgasm">DOM</span>' : '') + '</td>' +
                        resBar('magicka', a.magicka, mgOff) + resBar('stamina', a.stamina, mgOff) +
                        '<td class="barcell"><div class="bar' + cls + '"><div class="fill" style="width:' +
                        Math.max(0, Math.min(100, a.enjoyment)) + '%;background-color:' + barColor(a.enjoyment) +
                        '"></div></div></td>' +
                        '<td class="lock">' + (a.denied ? '<span title="orgasm denied">🔒</span>' : '') + '</td>' +
                        '</tr>';
                });
            }
            // Stage row on top, in the enjoyment bar column.
            const count = Number(state.stages) || 0, stage = Number(state.stage) || 0;
            if (html && count > 0) {
                let s = '';
                for (let i = 1; i <= count; i++) {
                    s += '<div class="stg' + (i === stage ? ' active' : '') + '" title="Stage ' + i + '/' + count + '"></div>';
                }
                // Bars span magicka + stamina + enjoyment columns; "stages" label sits right-aligned before them.
                html = '<tr class="stagerow">' +
                    '<td class="focus"></td>' +
                    '<td class="stagelabel">stages</td>' +
                    '<td colspan="3"><div class="stages">' + s + '</div></td>' +
                    '<td class="lock"></td></tr>' + html;
            }
            rows.innerHTML = html;
            const enjoyOn = !!g.enjoyment && html !== '';
            document.getElementById('enjoyment').classList.toggle('visible', enjoyOn);

            // Controls part, numpad grid. Each label names what a press does.
            //   calm      arouse  deny  free 📷  <slower step>
            //   previous  pause   next  end      <faster step>
            // Every slot is always emitted (hidden with .off) so nothing shifts when parts toggle.
            const cOff = !g.controls;
            const mgcOff = cOff || !g.minigame;
            const fa = actors[state.focus];
            const slower = state.slower || '', faster = state.faster || '';
            let c = '';
            c += ctl(keys, 'calm', blocked.broken ? 'broken' : 'calm', 0, true, { blocked: blocked.calm, off: mgcOff });
            c += ctl(keys, 'arouse', 'arouse', 1, true, { blocked: blocked.arouse, off: mgcOff });
            c += ctl(keys, 'deny', fa && fa.denied ? 'allow' : 'deny', 2, true, { off: cOff });
            c += ctl(keys, 'free', 'free 📷', 3, true, { off: cOff });
            c += ctl(keys, 'slower', slower || NO_STEP, 4, true, { dim: !slower, off: cOff });
            c += ctl(keys, 'previous', 'previous', 0, false, { off: cOff });
            c += ctl(keys, 'pause', state.paused ? 'play' : 'pause', 1, false, { off: cOff });
            c += ctl(keys, 'next', 'next', 2, false, { off: cOff });
            c += ctl(keys, 'end', 'end', 3, false, { off: cOff });
            c += ctl(keys, 'faster', faster || NO_STEP, 4, false, { dim: !faster, off: cOff });
            const controlsOn = !!g.controls;
            const controls = document.getElementById('controls');
            controls.innerHTML = c;
            controls.classList.toggle('visible', controlsOn);

            hud.classList.toggle('visible', enjoyOn || controlsOn);
        }
        window.hudUpdate = hudUpdate;
    </script>
</body>
</html>
