plugin:
  name: "SkyrimNet_SexLab"
  version: "0.35.1"
  description: "Sexlab-SkyrimNet integration"
  icon: "⚗️"

schema:
  fields:
    - name: "Hide hermaphrodites from prompt"
      path: "sexlab.prompt.hide_hermaphrodites"
      type: "bool"
      description: "Hides hermaphrodite labels in the prompt."
      defaultValue: false
      category: "Prompt"

    - name: "Public sex accepted"
      path: "sexlab.prompt.public_sex_accepted"
      type: "bool"
      description: "Treat public sex as a socially accepted intent in prompts."
      defaultValue: false
      category: "Prompt"

    - name: "Add rape actions"
      path: "sexlab.actions.rape_allowed"
      type: "bool"
      description: "When off, unregisters NPC rape LLM actions. Turning this back on requires a save and reload."
      defaultValue: true
      category: "Actions"

    - name: "Tag dialogs for player actions"
      path: "sexlab.tags.player"
      type: "bool"
      description: "Opens tag-edit dialogs for events that include the player."
      defaultValue: true
      category: "Tags"

    - name: "Tag dialogs for non-player actions"
      path: "sexlab.tags.nonplayer"
      type: "bool"
      description: "Opens tag-edit dialogs for events that do not include the player."
      defaultValue: false
      category: "Tags"

    - name: "Devious devices are added to tags"
      path: "sexlab.tags.filter_by_devious_devices"
      type: "bool"
      description: "When an actor wears Devious Devices heavy bondage (armbinder, yoke, front cuffs, other bound devices), scenes started from the TargetMenu prefer animations with the matching tag, and the Scene Creator and Description Editor animation filters start with it. A tag with no matching animation is dropped. You can always remove the tags in the Scene Creator. Actors not wearing devices are unaffected."
      defaultValue: true
      category: "Tags"

    - name: "Enable Start Sex / Edit Stage hotkey"
      path: "sexlab.editor.hotkey_enabled"
      type: "bool"
      description: "Enables the Start Sex / Edit Stage Description hotkey."
      defaultValue: false
      category: "Controls"

    - name: "Start Sex / Edit Stage hotkey"
      path: "sexlab.editor.hotkey"
      type: "hotkey"
      description: "Hotkey to open Start Sex / Edit Stage Description. Applies when the hotkey is enabled. Default is backslash (\\)."
      min: 1
      max: 255
      required: false
      defaultValue: 220
      category: "Controls"
      supportsOverride: false

    - name: "Style changes animation speed"
      path: "sexlab.speed.enabled"
      type: "bool"
      description: "Scene style sets animation playback speed. Speed only: stage length, orgasm timing and voices are unchanged."
      defaultValue: true
      category: "Animation speed"

    - name: "Gently speed"
      path: "sexlab.speed.gently"
      type: "float"
      description: "Animation playback multiplier for the gently style."
      min: 0.1
      max: 3.0
      defaultValue: 0.75
      category: "Animation speed"

    - name: "Normally speed"
      path: "sexlab.speed.normally"
      type: "float"
      description: "Animation playback multiplier for the normally style."
      min: 0.1
      max: 3.0
      defaultValue: 1.0
      category: "Animation speed"

    - name: "Forcefully speed"
      path: "sexlab.speed.forcefully"
      type: "float"
      description: "Animation playback multiplier for the forcefully style."
      min: 0.1
      max: 3.0
      defaultValue: 1.25
      category: "Animation speed"

    - name: "Hide Edit Stage Description help"
      path: "sexlab.editor.hide_help"
      type: "bool"
      description: "Hides the help dialogue when a stage has no description."
      defaultValue: false
      category: "Editor"

    - name: "Orgasm delay (sec)"
      path: "sexlab.orgasm.delay"
      type: "float"
      description: "Seconds to wait after the last orgasm (player or Dom slave) before one combined Direct Narration. Without a Dom slave, also extends the current stage when that narration is sent."
      min: 0
      max: 60
      defaultValue: 5.0
      category: "Narration"

    - name: "Orgasm narration max length (chars)"
      path: "sexlab.narration.max_chars"
      type: "int"
      description: "Length budget for the one orgasm Direct Narration. Orgasming, forced and denied actors are always included; cum, not-orgasming and arouse/calm lines that do not fit are sent as an event instead."
      min: 100
      max: 2000
      defaultValue: 350
      category: "Narration"

    - name: "Cum lasts (game hours)"
      path: "sexlab.cum.duration_hours"
      type: "float"
      description: "How long cum left on a mouth, pussy or ass after an orgasm stays in the character bio. Warm for the first game hour, then drying until this runs out. Swimming washes it off. 0 = off."
      min: 0
      max: 48
      defaultValue: 4.0
      category: "Narration"

    - name: "SexLab moans follow speaking modifiers"
      path: "sexlab.voice.follow_speaking"
      type: "bool"
      description: "SexLab moans only for actors with _pleasure_ or _pain_ speaking modifiers; actors with none, _gagged_, or _kissing_ are silent. Off = normal SexLab voices."
      defaultValue: true
      category: "Voice"

    - name: "Narration cooldown (sec)"
      path: "sexlab.narration.cooldown"
      type: "float"
      description: "Minimum seconds since last audio ended before the next optional Direct Narration."
      min: 1
      max: 120
      defaultValue: 20
      category: "Narration"

    - name: "Narration max distance (m)"
      path: "sexlab.narration.max_distance"
      type: "float"
      description: "Maximum distance in meters that can generate a new Direct Narration."
      min: 5
      max: 100
      defaultValue: 15
      category: "Narration"

    - name: "Sex framework (0 SexLab, 1 Ostim)"
      path: "sexlab.ostim.player"
      type: "int"
      description: "Which framework starts sex for the player when OstimNet is installed. 0 = SexLab, 1 = Ostim."
      min: 0
      max: 1
      defaultValue: 0
      category: "General"

    - name: "Show enjoyment bars"
      path: "sexlab.hud.enjoyment"
      type: "bool"
      description: "Scene HUD (upper left, player scenes only): the stage row and one enjoyment bar per actor (with the mini-game, also its focus and magicka/stamina columns). The controls row is unaffected."
      defaultValue: true
      category: "Scene HUD"

    - name: "Show scene controls"
      path: "sexlab.hud.controls"
      type: "bool"
      description: "Scene HUD: end / previous / pause / next / slower / faster / PosUp / PosDn hotkeys and their labels. Off also disables those keys."
      defaultValue: true
      category: "Scene HUD"

    - name: "End scene key"
      path: "sexlab.hud.key_end"
      type: "hotkey"
      description: "Ends the player's scene (same as stop). Default Num 2."
      min: 1
      max: 255
      required: false
      defaultValue: 98
      category: "Scene HUD"
      supportsOverride: false

    - name: "Previous stage key"
      path: "sexlab.hud.key_previous"
      type: "hotkey"
      description: "Goes back one stage. Default Num 4."
      min: 1
      max: 255
      required: false
      defaultValue: 100
      category: "Scene HUD"
      supportsOverride: false

    - name: "Pause on current stage key"
      path: "sexlab.hud.key_pause"
      type: "hotkey"
      description: "Holds the current stage (it stops advancing); press again to resume with the stage's remaining time. Enjoyment holds while paused. Default Num 5."
      min: 1
      max: 255
      required: false
      defaultValue: 101
      category: "Scene HUD"
      supportsOverride: false

    - name: "Next stage key"
      path: "sexlab.hud.key_next"
      type: "hotkey"
      description: "Advances one stage. Default Num 6."
      min: 1
      max: 255
      required: false
      defaultValue: 102
      category: "Scene HUD"
      supportsOverride: false

    - name: "Position up key"
      path: "sexlab.hud.key_pos_up"
      type: "hotkey"
      description: "PosUp: swaps the actors' roles forward (SexLab's swap positions). Does nothing in solo or creature scenes. Default PgUp."
      min: 1
      max: 255
      required: false
      defaultValue: 33
      category: "Scene HUD"
      supportsOverride: false

    - name: "Position down key"
      path: "sexlab.hud.key_pos_down"
      type: "hotkey"
      description: "PosDn: swaps the actors' roles back. Default PgDn."
      min: 1
      max: 255
      required: false
      defaultValue: 34
      category: "Scene HUD"
      supportsOverride: false

    - name: "Narrate position changes"
      path: "sexlab.hud.pos_narration"
      type: "bool"
      description: "After PosUp / PosDn, narrate \"The scene changes to ...\" with the current stage description and the actors in their new roles."
      defaultValue: true
      category: "Scene HUD"

    - name: "Take control key"
      path: "sexlab.hud.key_take_control"
      type: "hotkey"
      description: "In your own scene: switches auto play on or off (the AI plays you: strategy, keys and lines). Aimed at an NPC in another scene: you drive that NPC with the HUD keys; press again to let go. Default Num *."
      min: 1
      max: 255
      required: false
      defaultValue: 106
      category: "Scene HUD"
      supportsOverride: false

    - name: "Slower key"
      path: "sexlab.hud.key_slower"
      type: "hotkey"
      description: "Steps the scene down one speed level (gentle 75%, normal 100%, forceful 125%). Default Num -."
      min: 1
      max: 255
      required: false
      defaultValue: 109
      category: "Scene HUD"
      supportsOverride: false

    - name: "Faster key"
      path: "sexlab.hud.key_faster"
      type: "hotkey"
      description: "Steps the scene up one speed level (gentle 75%, normal 100%, forceful 125%). Default Num +."
      min: 1
      max: 255
      required: false
      defaultValue: 107
      category: "Scene HUD"
      supportsOverride: false

    - name: "Deny / allow orgasm key"
      path: "sexlab.hud.key_deny"
      type: "hotkey"
      description: "Toggles orgasm denial for the HUD's focus actor (🔒). A denied actor gains enjoyment as normal but cannot orgasm. Default Num 1."
      min: 1
      max: 255
      required: false
      defaultValue: 97
      category: "Scene HUD"
      supportsOverride: false

    - name: "Orgasm mode"
      path: "sexlab.enjoyment.mode"
      type: "select"
      description: "Always Orgasm Together at the end: SexLab's skill, Lewd/Pure, victim/aggressor and relationship rank make enjoyment rise faster (or slower); everyone reaches 100 just before the final stage and orgasms together. Multi-Orgasm Mini-game: that bonus is a constant rate factor; several orgasms or none are possible; the player plays the mini-game and NPCs pick strategies through LLM actions. Same setting as the pulldown in the SkyrimNet_SexLab MCM. Switching back to the mini-game needs a save and reload for its LLM actions."
      options:
        - "Always Orgasm Together at the end"
        - "Multi-Orgasm Mini-game"
      defaultValue: "Multi-Orgasm Mini-game"
      category: "Enjoyment"

    - name: "SexLab bonus scale"
      path: "sexlab.enjoyment.bonus_scale"
      type: "float"
      description: "How strongly SexLab's starting-enjoyment terms (relationship rank, Lewd/Pure by victim / aggressor / normal, partner's act skill) shape enjoyment. 0 = everyone the same."
      min: 0
      max: 2
      defaultValue: 0.5
      category: "Enjoyment"

    - name: "SexLab bonus limit"
      path: "sexlab.enjoyment.bonus_clamp"
      type: "float"
      description: "Largest bonus (plus or minus) an actor can get."
      min: 0
      max: 1
      defaultValue: 0.75
      category: "Enjoyment"

    - name: "Together curve strength"
      path: "sexlab.enjoyment.together_k_range"
      type: "float"
      description: "Always Orgasm Together: how much the bonus bends the curve. A positive bonus rises fast and stays high; a negative one starts slow. Everyone still reaches 100 just before the final stage."
      min: 0
      max: 5
      defaultValue: 2
      category: "Enjoyment"

    - name: "Mini-game bonus strength"
      path: "sexlab.enjoyment.minigame_bonus_mult"
      type: "float"
      description: "Multi-Orgasm Mini-game: passive gain x (1 + this x bonus)."
      min: 0
      max: 5
      defaultValue: 1
      category: "Enjoyment"

    - name: "Mini-game Mutual target"
      path: "sexlab.enjoyment.mutual_target"
      type: "float"
      description: "Multi-Orgasm Mini-game: the scene's enjoyment rates are set once, from its stage timers, so that with every NPC on Mutual everyone reaches this enjoyment at the end of the second-to-last stage (stage advance enjoyment included). Extra time (pause, going back a stage, long narration) adds more. The player has to play their part: an NPC's moves alone bring a player scene to about 60."
      min: 50
      max: 100
      defaultValue: 87
      category: "Enjoyment"

    - name: "Mini-game passive share"
      path: "sexlab.enjoyment.passive_share"
      type: "float"
      description: "Multi-Orgasm Mini-game: share of the Mutual target that comes from passive gain. The rest comes from NPC strategy moves, so a Passive actor nobody arouses reaches only this share of the target."
      min: 0
      max: 1
      defaultValue: 0.3
      category: "Enjoyment"

    - name: "Normal enjoyment multiplier"
      path: "sexlab.enjoyment.passive_mult"
      type: "float"
      description: "Enjoyment rate for consensual actors. Multi-Orgasm Mini-game: only the ratio of the three role multipliers matters (aggressor and victim pace relative to this one); the pace comes from Mini-game Mutual target. DOM slaves and scenes without SexLab stage timers: rate x the stage-timer base rate (at 1.0, 100 near the end of the final stage on its timers; default 0.4 because narration makes scenes 2-3x longer). The OrgasmEngine triggers every orgasm; SexLab's own trigger is off."
      min: 0
      max: 5
      defaultValue: 0.4
      category: "Enjoyment"

    - name: "Aggressor enjoyment multiplier"
      path: "sexlab.enjoyment.aggressor_mult"
      type: "float"
      description: "Enjoyment rate for the aggressor in a non-consensual scene. Mini-game: relative to the normal multiplier (0.45 / 0.4 = 1.125x a consensual actor)."
      min: 0
      max: 5
      defaultValue: 0.45
      category: "Enjoyment"

    - name: "Victim enjoyment multiplier"
      path: "sexlab.enjoyment.victim_mult"
      type: "float"
      description: "Enjoyment rate for a victim. Mini-game: relative to the normal multiplier (0.3 / 0.4 = 0.75x a consensual actor)."
      min: 0
      max: 5
      defaultValue: 0.3
      category: "Enjoyment"

    - name: "Rate jitter minimum"
      path: "sexlab.enjoyment.jitter_min"
      type: "float"
      description: "Each actor's rate is multiplied by a random value between the minimum and maximum, rolled at scene start. Above 1.0 orgasms a little early."
      min: 0.5
      max: 2
      defaultValue: 0.95
      category: "Enjoyment"

    - name: "Rate jitter maximum"
      path: "sexlab.enjoyment.jitter_max"
      type: "float"
      description: "Upper end of the per-actor random rate factor."
      min: 0.5
      max: 2
      defaultValue: 1.1
      category: "Enjoyment"

    - name: "Group orgasm threshold"
      path: "sexlab.enjoyment.group_join"
      type: "float"
      description: "When someone orgasms, every other actor at this enjoyment or more joins them, in one narration. Below it, enjoyment + random bonus must reach 100."
      min: 0
      max: 100
      defaultValue: 85
      category: "Enjoyment"

    - name: "Gate group orgasm threshold"
      path: "sexlab.enjoyment.group_join_final"
      type: "float"
      description: "When someone passes the orgasm gate, every other actor at this enjoyment or more joins them, in one narration."
      min: 0
      max: 100
      defaultValue: 90
      category: "Enjoyment"

    - name: "Stage advance enjoyment"
      path: "sexlab.enjoyment.stage_spike"
      type: "float"
      description: "Enjoyment added to every actor expected to orgasm each time the scene moves to the next stage. Also added to the ending gate and final-stage orgasm rolls."
      min: 0
      max: 30
      defaultValue: 5
      category: "Enjoyment"

    - name: "Orgasm roll random bonus"
      path: "sexlab.minigame.random_bonus"
      type: "float"
      description: "Every orgasm roll (partner's orgasm, ending gate, final stage, and the mini-game's once-a-second test) adds a random 0 to this much to enjoyment. An orgasm lands when the total reaches 100. Final-stage rolls also add Stage advance enjoyment."
      min: 0
      max: 30
      defaultValue: 10
      category: "Enjoyment"

    - name: "Orgasm targets end the scene"
      path: "sexlab.ending.enabled"
      type: "bool"
      description: "The scene's lead (the aggressor when there is a victim, otherwise the initiator) has a target number of orgasms, rolled at scene start. As soon as they reach it, the scene jumps to the last stage."
      defaultValue: true
      category: "Scene ending"

    - name: "Male orgasm target minimum"
      path: "sexlab.ending.target_male_min"
      type: "int"
      description: "Fewest orgasms a male lead needs before the scene jumps to the last stage. 0: never jumps."
      min: 0
      max: 5
      defaultValue: 1
      category: "Scene ending"

    - name: "Male orgasm target maximum"
      path: "sexlab.ending.target_male_max"
      type: "int"
      description: "Most orgasms a male lead needs. The target is rolled between the minimum and maximum."
      min: 0
      max: 5
      defaultValue: 1
      category: "Scene ending"

    - name: "Female orgasm target minimum"
      path: "sexlab.ending.target_female_min"
      type: "int"
      description: "Fewest orgasms a female lead needs before the scene jumps to the last stage. 0: never jumps."
      min: 0
      max: 5
      defaultValue: 1
      category: "Scene ending"

    - name: "Female orgasm target maximum"
      path: "sexlab.ending.target_female_max"
      type: "int"
      description: "Most orgasms a female lead needs. The target is rolled between the minimum and maximum."
      min: 0
      max: 5
      defaultValue: 2
      category: "Scene ending"

    - name: "Orgasm check before the last stage"
      path: "sexlab.ending.gate"
      type: "bool"
      description: "Shortly before the last stage (early by the measured time from narration to voice), each actor who has not orgasmed rolls once, with a chance equal to their enjoyment. For those who pass, the orgasm narration is sent at once, their bars fill, and the last stage starts with the orgasm when the voice begins. If nobody passes, the scene goes on with no orgasm. Off: actors at 90%+ near the end of the last stage still orgasm. Mini-game: only when nobody is under the player's control (NPCs, player on auto play); then the scene lead always passes, earlier orgasms still count, and nobody else orgasms in the last two stages except at this check."
      defaultValue: true
      category: "Scene ending"

    - name: "Narration to voice estimate"
      path: "sexlab.ending.gate_lead_default"
      type: "float"
      description: "Seconds from sending a narration to its first spoken line, used to time the orgasm check until a few real narrations have been measured this session."
      min: 1
      max: 20
      defaultValue: 5
      category: "Scene ending"

    - name: "Longest wait for the orgasm voice"
      path: "sexlab.ending.gate_wait_max"
      type: "float"
      description: "After a passed orgasm check, the stage before the last is held until the orgasm narration starts speaking, for at most this many seconds."
      min: 5
      max: 60
      defaultValue: 20
      category: "Scene ending"

    - name: "Hold last stage for orgasm dialogue"
      path: "sexlab.ending.dialogue_hold_max"
      type: "float"
      description: "After the orgasm that ends the scene, the last stage is held until the response to the orgasm has played, for at most this many seconds (30 at most). 0: no hold."
      min: 0
      max: 30
      defaultValue: 30
      category: "Scene ending"

    - name: "DOM arousal per scene"
      path: "sexlab.dom.arousal_scale"
      type: "float"
      description: "DOM slaves: DOM arousal amount (MOD_Daring) per point of scene progress, pushed in steps over the animation. 0.2 = DOM's own 20 per scene, which is cancelled."
      min: 0
      max: 2
      defaultValue: 0.2
      category: "Enjoyment"

    - name: "DOM arousal per player scene"
      path: "sexlab.dom.arousal_scale_player"
      type: "float"
      description: "DOM slaves in player scenes: extra DOM arousal (MOD_Naivety) per point of progress. 0.2 = DOM's own 20 at its roll, which is cancelled."
      min: 0
      max: 2
      defaultValue: 0.2
      category: "Enjoyment"

    - name: "Arousal never below enjoyment"
      path: "sexlab.arousal.floor_enjoyment"
      type: "bool"
      description: "With SLO Aroused NG (or OSL Aroused) installed, raises arousal to match enjoyment during scenes. Arousal is never lowered."
      defaultValue: true
      category: "Enjoyment"

    - name: "Calm key"
      path: "sexlab.minigame.key_calm"
      type: "hotkey"
      description: "Calms the focused actor (costs your magicka). At 90%+ enjoyment it also edges (holds off the orgasm). Default Num 8."
      min: 1
      max: 255
      required: false
      defaultValue: 104
      category: "Mini-game"
      supportsOverride: false

    - name: "Arouse key"
      path: "sexlab.minigame.key_arouse"
      type: "hotkey"
      description: "Arouses the focused actor (costs your stamina). Default Num 9."
      min: 1
      max: 255
      required: false
      defaultValue: 105
      category: "Mini-game"
      supportsOverride: false

    - name: "Force hotkey"
      path: "sexlab.minigame.key_force"
      type: "hotkey"
      description: "When you are the aggressor, opens the Force panel: force a victim into a strategy by a method (slap, punch, a weak attack spell you know, ...). Greyed out on the HUD without a non-player victim. Default Num ."
      min: 1
      max: 255
      required: false
      defaultValue: 110
      category: "Mini-game"
      supportsOverride: false

    - name: "Aid hotkey"
      path: "sexlab.minigame.key_aid"
      type: "hotkey"
      description: "Opens the Aid panel: cast one of your healing or stamina spells (costs magicka) or use a healing or stamina potion on an actor in the scene. Greyed out on the HUD when you have none. Default Num 0"
      min: 1
      max: 255
      required: false
      defaultValue: 96
      category: "Mini-game"
      supportsOverride: false

    - name: "Allow right mouse to arouse and left mouse to calm"
      path: "sexlab.minigame.mouse"
      type: "bool"
      description: "With the mini-game on, right mouse button arouses and left mouse button calms the focused actor (alongside the arouse / calm keys). Clicks are captured only while the scene HUD is up."
      defaultValue: true
      category: "Mini-game"

    - name: "Arouse amount"
      path: "sexlab.minigame.arouse_amount"
      type: "float"
      description: "Enjoyment added per arouse (x (1 + 0.1 x skill)). Forced actors add half."
      min: 0.5
      max: 20
      defaultValue: 2.4
      category: "Mini-game"

    - name: "Calm amount"
      path: "sexlab.minigame.calm_amount"
      type: "float"
      description: "Enjoyment removed per calm. Forced actors remove half."
      min: 0.5
      max: 20
      defaultValue: 3.2
      category: "Mini-game"

    - name: "Arouse stamina cost"
      path: "sexlab.minigame.stamina_cost"
      type: "float"
      description: "Stamina per arouse (x 10 / (10 + skill))."
      min: 0
      max: 50
      defaultValue: 8
      category: "Mini-game"

    - name: "Calm magicka cost"
      path: "sexlab.minigame.magicka_cost"
      type: "float"
      description: "Magicka per calm (x (1 + 0.05 x lewdness))."
      min: 0
      max: 50
      defaultValue: 8
      category: "Mini-game"

    - name: "Edge seconds"
      path: "sexlab.minigame.edge_seconds"
      type: "float"
      description: "Calming someone at 90%+ enjoyment holds off their orgasm for this long."
      min: 0
      max: 30
      defaultValue: 4
      category: "Mini-game"

    - name: "Mental break"
      path: "sexlab.minigame.mental_break"
      type: "bool"
      description: "Being aroused by a partner drains magicka. At 10% magicka or less the actor is broken and cannot calm or edge until above 25%."
      defaultValue: false
      category: "Mini-game"

    - name: "Mental break drain"
      path: "sexlab.minigame.break_drain"
      type: "float"
      description: "Magicka drained per arouse at 100% enjoyment (x partner skill, x orgasms)."
      min: 0
      max: 50
      defaultValue: 6
      category: "Mini-game"

    - name: "Calm / arouse narration window (sec)"
      path: "sexlab.minigame.narrate_window"
      type: "float"
      description: "Presses on another actor within this window give one narration."
      min: 0
      max: 30
      defaultValue: 3
      category: "Mini-game"

    - name: "NPC strategy step interval (sec)"
      path: "sexlab.minigame.npc_interval"
      type: "float"
      description: "Seconds between an NPC's mini-game moves for its strategy."
      min: 0.25
      max: 30
      defaultValue: 2
      category: "Mini-game"

    - name: "Fear cooldown"
      path: "sexlab.minigame.fear_cooldown"
      type: "float"
      description: "Seconds after you force a victim (Force hotkey) during which the victim can only give in, not resist."
      min: 0
      max: 600
      defaultValue: 2
      category: "Mini-game"

    - name: "NPC step minimum"
      path: "sexlab.minigame.npc_step_min"
      type: "float"
      description: "Scenes with SexLab stage timers: the size of each NPC strategy move comes from Mini-game Mutual target; the minimum and maximum only set its random spread (4-8: 0.67x to 1.33x). Scenes without timers: each move changes enjoyment by a random amount between the minimum and maximum. Arouse also scales with skill."
      min: 0
      max: 50
      defaultValue: 4
      category: "Mini-game"

    - name: "NPC step maximum"
      path: "sexlab.minigame.npc_step_max"
      type: "float"
      description: "Upper end of an NPC strategy move (timed scenes: of its random spread)."
      min: 0
      max: 50
      defaultValue: 8
      category: "Mini-game"

    - name: "Decision model picks NPC strategies"
      path: "sexlab.minigame.decision_strategy"
      type: "bool"
      description: "SkyrimNet's decision model (e.g. Jev) picks every NPC's strategy when a scene starts, and re-picks an NPC's strategy after each line that NPC speaks in the scene. Needs a decisions provider set up in SkyrimNet; without one, NPCs keep the default strategies below."
      defaultValue: true
      category: "Mini-game"

    - name: "Decision minimum confidence"
      path: "sexlab.minigame.decision_min_confidence"
      type: "float"
      description: "The decision model only changes an NPC's strategy when it is at least this sure of its pick (0 to 1). Less sure answers keep the current strategy. 0 accepts every answer."
      min: 0
      max: 1
      defaultValue: 0.6
      category: "Mini-game"

    - name: "Default strategy (normal)"
      path: "sexlab.minigame.default_strategy_normal"
      type: "select"
      description: "Fallback strategy for NPCs in consensual scenes: used until the decision model's first pick arrives, and always when no decisions provider is set up."
      options:
        - "Mutual"
        - "Selfish"
        - "Selfless"
        - "Together"
        - "Passive"
      defaultValue: "Mutual"
      category: "Mini-game"

    - name: "Default strategy (aggressor)"
      path: "sexlab.minigame.default_strategy_aggressor"
      type: "select"
      description: "Fallback strategy for aggressors: used until the decision model's first pick arrives, and always when no decisions provider is set up."
      options:
        - "Selfish"
        - "Mutual"
        - "Selfless"
        - "Together"
        - "Passive"
      defaultValue: "Selfish"
      category: "Mini-game"

    - name: "Default strategy (victim)"
      path: "sexlab.minigame.default_strategy_victim"
      type: "select"
      description: "Fallback strategy for victims: used until the decision model's first pick arrives, and always when no decisions provider is set up."
      options:
        - "Passive"
        - "Reject"
        - "Cum quick"
        - "Selfish"
        - "Mutual"
        - "Selfless"
        - "Together"
      defaultValue: "Passive"
      category: "Mini-game"

    - name: "LLM mini-game strength"
      path: "sexlab.minigame.llm_multiplier"
      type: "float"
      description: "Multiplier for the SexLab_Arouse / SexLab_Calm LLM actions (stronger than one key press)."
      min: 0.1
      max: 10
      defaultValue: 3
      category: "Mini-game"
