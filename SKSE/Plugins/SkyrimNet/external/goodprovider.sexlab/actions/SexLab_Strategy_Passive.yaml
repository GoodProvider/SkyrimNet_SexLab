name: SexLab_Strategy_Passive
label: "Strategy: Passive"
description: "[speaker] stops trying and lets things happen during ongoing sex."
questEditorId: SkyrimNet_SexLab
scriptName: SkyrimNet_SexLab_Actions
executionFunctionName: MiniGame_StrategySelf
defaultPriority: 5
parameterMapping:
  - type: speaker
    name: speaker
    description: Speaker Actor parameter (triggering entity)
  - type: static
    name: strategy
    value: passive
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments: [currentActor, SexLabAnimatingFaction]
        comparisonOperator: ">"
        expectedValue: 0
      - decoratorName: papyrus_util
        arguments: ["HasIntValue", currentActor, "skyrimnet_sexlab_strategy_passive"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: AND
    required: true
