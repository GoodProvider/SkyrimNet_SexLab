description: "[speaker] teases [target] during ongoing sex, holding them at the edge of orgasm."
questEditorId: SkyrimNet_SexLab
scriptName: SkyrimNet_SexLab_Actions
executionFunctionName: MiniGame_Strategy
defaultPriority: 5
parameterMapping:
  - type: speaker
    name: speaker
    description: Speaker Actor parameter (triggering entity)
  - type: dynamic
    name: target
    description: Partner being teased
