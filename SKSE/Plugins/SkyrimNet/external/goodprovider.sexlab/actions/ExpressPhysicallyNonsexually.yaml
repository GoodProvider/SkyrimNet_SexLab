customCategory: sexlab_nonsexual
name: ExpressPhysicallyNonsexually
label: Affection
description: 'PARAMS: {"direction":"giving|getting", "what":"comforting|greeting|showing affection", "type":"hug|kiss|hugging|kissing|cuddling", "intent":"who, how, and why"} - [what] by [direction] [type]'
enabled: true
eligibilityRules:
  - conditions:
      - decoratorName: get_global_value
        arguments:
          - skyrimnet_sexlab_ostim_player
        comparisonOperator: ==
        expectedValue: 0
      - decoratorName: get_faction_rank
        arguments:
          - currentActor
          - SexLabAnimatingFaction
        comparisonOperator: <
        expectedValue: 1
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - dse_dm_FactionActorUsingDevice
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: is_in_faction
        arguments:
          - currentActor
          - OStimActorCountFaction
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: is_in_combat
        arguments:
          - currentActor
        comparisonOperator: ==
        expectedValue: false
      - decoratorName: papyrus_util
        arguments:
          - "HasIntValue"
          - currentActor
          - "skyrimnet_sexlab_scene_actor_lock"
        comparisonOperator: ==
        expectedValue: false
    logicalOperator: AND
    required: true
