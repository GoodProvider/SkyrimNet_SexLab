name: SexLab_Strategy_NonSexual
label: "Strategy: Non-sexual"
description: "[speaker] keeps things affectionate and non-sexual (no attempt to arouse or calm anyone) during an ongoing non-sexual scene."
questEditorId: SkyrimNet_SexLab
scriptName: SkyrimNet_SexLab_Actions
executionFunctionName: MiniGame_StrategySelf
defaultPriority: 5
parameterMapping:
  - type: speaker
    name: speaker
    description: Speaker Actor parameter (triggering entity)
  - type: static
    name: strategy
    value: nonsexual
eligibilityRules:
  - conditions:
      - decoratorName: get_faction_rank
        arguments: [currentActor, SexLabAnimatingFaction]
        comparisonOperator: ">"
        expectedValue: 0
      - decoratorName: papyrus_util
        arguments: ["HasIntValue", currentActor, "skyrimnet_sexlab_strategy_nonsexual"]
        comparisonOperator: "=="
        expectedValue: true
    logicalOperator: AND
    required: true
